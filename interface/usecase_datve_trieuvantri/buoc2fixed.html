<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust - Hệ thống đang phân tích</title>
    <!-- Tích hợp Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ĐỔI FONT: Tích hợp Google Fonts (Dùng Lora thay cho Playfair Display để tiếng Việt chuẩn 100%) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f6f4ee; 
        }
        /* Cập nhật font Serif thành Lora */
        .font-serif {
            font-family: 'Lora', serif;
        }
        
        /* Cải thiện khả năng render text của trình duyệt */
        h1, h2, h3, p {
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Hiệu ứng loading bar */
        .loading-bar {
            position: relative;
            overflow: hidden;
        }
        .loading-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 50%;
            height: 100%;
            background-color: #8c6746;
            border-radius: 9999px;
            animation: slide 2s infinite ease-in-out;
        }
        @keyframes slide {
            0% { left: -50%; }
            100% { left: 100%; }
        }
        
        /* Hiệu ứng nhấp nháy chấm lửng */
        .loading-dots::after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            40% { color: #3a271d; text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            60% { text-shadow: .25em 0 0 #3a271d, .5em 0 0 rgba(0,0,0,0); }
            80%, 100% { text-shadow: .25em 0 0 #3a271d, .5em 0 0 #3a271d; }
        }
    </style>
</head>
<body class="text-[#333333] min-h-screen pb-12 pt-8">

    <!-- MAIN CONTENT -->
    <main class="max-w-5xl mx-auto px-4">
        
        <!-- STEPPER (THANH TIẾN TRÌNH) -->
        <div class="relative flex justify-between items-start w-10/12 mx-auto mb-10">
            <!-- Đường kẻ ngang nối các bước -->
            <div class="absolute top-5 left-0 w-full h-[2px] bg-[#d5cfc5] -z-10"></div>

            <!-- Bước 1 -->
            <div class="flex flex-col items-center w-1/4">
                <div class="w-10 h-10 rounded-full bg-[#8c6746] text-white flex items-center justify-center font-bold text-sm shadow-md">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <span class="text-[0.65rem] uppercase font-bold text-[#8c6746] mt-3">Khởi tạo yêu cầu</span>
            </div>

            <!-- Bước 2 -->
            <div class="flex flex-col items-center w-1/4">
                <div class="w-10 h-10 rounded-full bg-[#8c6746] text-white flex items-center justify-center font-bold text-sm shadow-md ring-4 ring-[#f6f4ee]">2</div>
                <span class="text-[0.65rem] uppercase font-bold text-[#8c6746] mt-3">Hệ thống Phân tích</span>
            </div>

            <!-- Bước 3 -->
            <div class="flex flex-col items-center w-1/4">
                <div class="w-10 h-10 rounded-full bg-[#f6f4ee] border-2 border-[#d5cfc5] text-[#888888] flex items-center justify-center font-bold text-sm bg-white">3</div>
                <span class="text-[0.65rem] uppercase text-[#888888] mt-3">Tùy chỉnh lịch trình</span>
            </div>

            <!-- Bước 4 -->
            <div class="flex flex-col items-center w-1/4">
                <div class="w-10 h-10 rounded-full bg-[#f6f4ee] border-2 border-[#d5cfc5] text-[#888888] flex items-center justify-center font-bold text-sm bg-white">4</div>
                <span class="text-[0.65rem] uppercase text-[#888888] mt-3">Lưu & Đặt dịch vụ</span>
            </div>
        </div>

        <!-- FORM CARD (TRẠNG THÁI LOADING) -->
        <div class="bg-white p-2 shadow-sm">
            <div class="border border-dashed border-[#d5cfc5] p-16 flex flex-col items-center justify-center text-center min-h-[450px]">
                
                <!-- Biểu tượng Loading -->
                <div class="relative flex items-center justify-center w-24 h-24 mb-6">
                    <div class="absolute inset-0 border-t-2 border-r-2 border-[#8c6746] rounded-full animate-spin"></div>
                    <div class="text-[#8c6746] opacity-80">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path>
                        </svg>
                    </div>
                </div>

                <!-- Tiêu đề (Đã bỏ tracking-wide gây giãn chữ) -->
                <!-- Xóa hẳn thẻ h2 cũ và dán thẻ này vào -->
<!-- Chuyển sang dùng font hệ thống mặc định để ép chữ hiển thị liền mạch -->
<h2 class="text-3xl text-[#3a271d] font-bold mb-4" style="font-family: 'Times New Roman', Times, serif;">
    2. Hệ Thống Đang Phân Tích & Đề Xuất<span class="loading-dots"></span>
</h2>
                
                <!-- Mô tả chi tiết -->
                <p class="text-gray-500 max-w-lg text-sm leading-relaxed mb-10">
                    Vui lòng đợi trong giây lát. Hệ thống đang tiến hành đối chiếu sở thích của bạn với hàng ngàn dữ liệu điểm đến, nhà hàng và khách sạn để xây dựng một lộ trình tối ưu nhất...
                </p>

                <!-- Thanh Loading Bar -->
                <div class="loading-bar w-64 h-1.5 bg-[#e5dfd3] rounded-full overflow-hidden"></div>

            </div>
        </div>
    </main>

</body>
</html>
